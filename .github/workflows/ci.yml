name: frontend-ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Test merchant offer matcher (offline)
        run: python -m unittest discover -s tests -v
      - name: Generate private offer preview without partner feeds
        run: python scripts/match_offers.py
      - run: npm install
      - run: npm run build
      - name: Validate generated SEO pages
        run: python3 scripts/check_seo_build.py
