name: frontend-ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test offline merchant matching
        run: python -m unittest discover -s tests -v
      - name: Generate preview (offline, without merchant feeds)
        run: python scripts/match_offers.py
      - run: npm install
      - run: npm run build
